name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # 统一解析版本号，供打包与制品命名使用（tag v1.2.0 -> 1.2.0）
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # 非 tag 构建（main / PR / 手动触发）使用 CI 版本号
            VERSION="0.0.0-ci"
          fi
          echo "解析到版本号：$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows x64
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux x64
          - os: ubuntu-latest
            rid: linux-arm64
            name: Linux ARM64

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原
        run: dotnet restore NetRadio.csproj -r ${{ matrix.rid }}

      - name: 编译（Release，无警告视为通过）
        run: dotnet build NetRadio.csproj -c Release -r ${{ matrix.rid }} --no-restore

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/package.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/package.sh ${{ matrix.rid }} "$VERSION"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          # 制品名同样带版本号：NetRadio-<版本>-<架构>
          name: NetRadio-${{ env.VERSION }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # Android 独立 job：需要 Android 工作负载 + SDK，构建耗时与桌面三平台分开跑
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-android-nuget-${{ hashFiles('Android/**/*.csproj', 'NetRadio.csproj') }}
          restore-keys: ${{ runner.os }}-android-nuget-

      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 准备 Android SDK 组件
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: 打包 APK
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-android.sh "$VERSION"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          # 制品名同样带版本号：NetRadio-<版本>-android
          name: NetRadio-${{ env.VERSION }}-android
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [ version, build, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码（供 gh 生成 Release 说明与校验标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 收集各平台制品
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 汇总到单一目录
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -lh release

      - name: 创建 Release 并附带制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NetRadio $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            release/*
